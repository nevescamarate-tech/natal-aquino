<!DOCTYPE html>
<html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Festa de Natal Aquino 2026</title>
<meta name="description" content="App da organização: tarefas, responsáveis e progresso. Sábado, 19 de dezembro.">
<meta property="og:type" content="website">
<meta property="og:title" content="🎄 Festa de Natal Aquino 2026">
<meta property="og:description" content="Toque para abrir a app da organização: tarefas, quem faz o quê e progresso. Sábado, 19 de dezembro.">
<meta property="og:image" content="https://nevescamarate-tech.github.io/natal-aquino/preview.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://nevescamarate-tech.github.io/natal-aquino/">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎄</text></svg>">

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Playfair+Display:ital,wght@1,700&family=Great+Vibes&family=Source+Sans+3:wght@400;600&display=swap">
<style id="app-css">
/* Layout: banda vermelho-Natal com neve e fio de luzes, logótipo Aquino em placa branca; árvore de progresso; lista de tarefas por fase à esquerda, "Quem faz o quê" à direita */
:root{
  --bg:#FAF6F1; --surface:#FFFFFF; --ink:#22201E; --muted:#6B625B; --line:#E7DED5;
  --pine:#1F5B33; --band:#A3162A; --band2:#6E0D1B; --band-ink:#FFF8F0; --snow:#FFFFFF; --leaf:#5E9732; --leaf-soft:#E6F0DC;
  --red:#B3152F; --red-soft:#F8E1E4; --gold:#B88A1B; --gold-soft:#F6EDD3;
  --fest:"Playfair Display",Georgia,serif; --script:"Great Vibes","Brush Script MT",cursive;
  --display:"Outfit","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14100F; --surface:#1E1817; --ink:#F2ECE6; --muted:#ADA29A; --line:#352B29;
  --pine:#7FCB8F; --band:#5A0D17; --band2:#300609; --band-ink:#FFF4EA; --snow:#FFFFFF; --leaf:#80BC52; --leaf-soft:#22311B;
  --red:#EC5468; --red-soft:#3A1A20; --gold:#E0B44A; --gold-soft:#33291A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14100F; --surface:#1E1817; --ink:#F2ECE6; --muted:#ADA29A; --line:#352B29;
  --pine:#7FCB8F; --band:#5A0D17; --band2:#300609; --band-ink:#FFF4EA; --snow:#FFFFFF; --leaf:#80BC52; --leaf-soft:#22311B;
  --red:#EC5468; --red-soft:#3A1A20; --gold:#E0B44A; --gold-soft:#33291A; color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
*{box-sizing:border-box}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--leaf);outline-offset:2px}

/* Banda */
.band{background:radial-gradient(120% 140% at 80% 0%,var(--band) 0%,var(--band2) 100%);color:var(--band-ink);position:relative;overflow:hidden}
#snow{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.lights{position:absolute;left:0;right:0;bottom:4px;height:26px;pointer-events:none}
.lights::before{content:"";position:absolute;left:-10px;right:-10px;top:-14px;height:20px;border-bottom:2px solid #1d3a22;border-radius:0 0 50% 50%/0 0 100% 100%;
  background:none;-webkit-mask:none}
.lights i{position:absolute;top:2px;width:11px;height:16px;border-radius:50% 50% 50% 50%/40% 40% 60% 60%;box-shadow:0 0 10px 2px currentColor;background:currentColor}
.lights i::before{content:"";position:absolute;top:-4px;left:3px;width:5px;height:5px;background:#2b3a2c;border-radius:1px}
@media (prefers-reduced-motion:no-preference){.lights i{animation:tw 1.6s ease-in-out infinite alternate}}
@keyframes tw{from{opacity:1}to{opacity:.35;box-shadow:none}}
.band .wrap{position:relative;padding-block:28px 52px;display:flex;gap:28px;align-items:center;flex-wrap:wrap}
.plate{background:#fff;border-radius:6px;padding:14px 18px;flex:none;box-shadow:0 6px 16px #0003}
.plate img{display:block;width:210px;height:auto}
.head{flex:1 1 320px;min-width:0}
.eyebrow{font-family:var(--script);font-size:34px;line-height:1;color:#F6D27A}
.band h1{font-family:var(--fest);font-style:italic;font-size:clamp(32px,5vw,54px);font-weight:700;line-height:1.05;margin-top:4px}
.band h1 em{font-style:italic;color:#F6D27A}
.when{margin-top:10px;display:flex;gap:10px 18px;flex-wrap:wrap;font-size:16px;opacity:.92}
.countdown{flex:none;text-align:center;background:#FFF8EC;color:#7E0F1F;border-radius:6px 6px 6px 6px;padding:16px 20px 12px;min-width:130px;position:relative;transform:rotate(3deg);box-shadow:0 8px 18px #0004;
  clip-path:polygon(0 14px,14px 0,calc(100% - 14px) 0,100% 14px,100% 100%,0 100%)}
.countdown::before{content:"";position:absolute;top:8px;left:50%;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--band2)}
.countdown b{color:#A3162A}
.countdown b{display:block;font-family:var(--display);font-size:46px;line-height:1;font-variant-numeric:tabular-nums}
.countdown b{margin-top:8px}
.countdown span{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:600}

/* Resumo */
.summary{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;align-items:start;gap:12px;margin-top:-18px;position:relative}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;min-width:0}
.stat .k{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.stat.prog,.stat:first-child{}
.stat .v{font-family:var(--display);font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}
.stat .v small{font-size:15px;color:var(--muted);font-weight:500}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--leaf);border-radius:5px}
.stat.prog{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.ring{width:150px;flex:none;text-align:center}
.ring svg{display:block;width:100%;height:auto}
.ring-c{margin-top:2px}
.ring-c b{font-family:var(--display);font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.ring-c b{color:var(--red)}
.ring-c span{display:block;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.pbars{flex:1 1 200px;min-width:0;display:grid;gap:7px}
.pb{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;font-size:14px}
.pb .pl{font-weight:600}.pb .pv{color:var(--muted);font-variant-numeric:tabular-nums}
.pb .bar{grid-column:1/-1;margin-top:0;height:8px}
.stat.warn .v{color:var(--red)}
.stat.tbd .v{color:var(--gold)}

/* Barra de filtros */
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:22px 0 8px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:600;font-size:15px}
.seg button[aria-pressed="true"]{background:var(--pine);border-color:var(--pine);color:var(--bg)}
.seg button .n{font-weight:400;opacity:.7;margin-left:4px;font-variant-numeric:tabular-nums}
.tools .grow{flex:1 1 180px;min-width:0}
.field{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;width:100%}
.check{display:flex;gap:8px;align-items:center;cursor:pointer;font-weight:600;font-size:15px}
.check input{width:18px;height:18px;accent-color:var(--leaf)}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px;align-items:start;padding-bottom:110px}
.phase{margin-top:22px}
.phase-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding-bottom:8px;border-bottom:3px solid transparent;
  border-image:repeating-linear-gradient(90deg,var(--red) 0 14px,var(--bg) 14px 20px,var(--leaf) 20px 34px,var(--bg) 34px 40px) 1}
.phase-h h2{font-family:var(--fest);font-style:italic;font-size:26px;font-weight:700}
.phase-h .date{color:var(--red);font-weight:600;font-family:var(--display)}
.phase-h .cnt{margin-left:auto;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.pnote{margin:10px 0 0;padding:10px 14px;background:var(--gold-soft);border-radius:6px;font-size:15px}

.sec{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.sec-h{display:flex;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.num{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:14px;color:#fff;position:relative;margin-top:4px;
  background:radial-gradient(circle at 35% 30%,#ff8a95 0,#C41E35 45%,#7E0F1F 100%)}
.num::before{content:"";position:absolute;top:-5px;left:50%;width:10px;height:6px;margin-left:-5px;background:#D9A936;border-radius:2px 2px 0 0}
.sec:nth-of-type(3n+2) .num{background:radial-gradient(circle at 35% 30%,#ffe7a3 0,#D4A12C 45%,#8a6510 100%)}
.sec:nth-of-type(3n) .num{background:radial-gradient(circle at 35% 30%,#a8e08a 0,#3E8A2A 45%,#1d4a14 100%)}
.sec-h h3{font-size:17px;font-weight:600;flex:1;min-width:0}
.sec-h .cnt{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.sec.done .sec-h h3::after{content:" ✓";color:var(--leaf)}

ul.tasks{list-style:none;margin:0;padding:0}
.task{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;padding:11px 14px;border-top:1px solid var(--line);align-items:start}
.task:first-child{border-top:0}
.task input[type=checkbox]{width:22px;height:22px;margin:1px 0 0;accent-color:var(--leaf);cursor:pointer}
.task input[type=checkbox]:disabled{cursor:default;opacity:1}
.t-text{font-weight:600}
.task.is-done .t-text{text-decoration:line-through;text-decoration-color:var(--muted);color:var(--muted);font-weight:400}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px;align-items:center}
.chip{font-size:13px;padding:2px 9px;border-radius:999px;background:var(--leaf-soft);color:var(--ink);border:0;cursor:pointer;font-weight:600}
.chip:hover{background:var(--leaf);color:var(--surface)}
.due{font-size:13px;padding:2px 9px;border-radius:4px;border:1px solid var(--line);color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.due.late{border-color:var(--red);background:var(--red-soft);color:var(--red)}
.due.tbd{border-color:var(--gold);background:var(--gold-soft);color:var(--gold)}
.note{font-size:14px;color:var(--muted);margin-top:4px;font-style:italic}
.edit-btn{border:0;background:none;color:var(--muted);cursor:pointer;font-size:14px;padding:2px 6px;border-radius:4px}
.edit-btn:hover{color:var(--ink);background:var(--bg)}
.add{display:block;width:100%;text-align:left;border:0;border-top:1px dashed var(--line);background:none;padding:10px 14px;color:var(--leaf);font-weight:600;cursor:pointer}
.add:hover{background:var(--leaf-soft)}

form.ed{padding:14px;border-top:1px solid var(--line);background:var(--bg);display:grid;grid-template-columns:1fr 1fr;gap:10px}
form.ed label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
form.ed .full{grid-column:1/-1}
form.ed .row{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 16px;font-weight:600;cursor:pointer}
.btn.pri{background:var(--leaf);border-color:var(--leaf);color:#fff}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn.danger.armed{background:var(--red);color:#fff}
.spacer{flex:1}

aside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);margin-top:22px}
.who{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.who h2{font-family:var(--fest);font-style:italic;font-size:22px;font-weight:700}
.who p{margin:4px 0 10px;color:var(--muted);font-size:14px}
.who ol{list-style:none;padding:0;margin:0;max-height:62vh;overflow:auto}
.who li button{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;text-align:left;background:none;border:0;padding:7px 6px;border-radius:6px;cursor:pointer}
.who li button:hover,.who li button[aria-pressed="true"]{background:var(--leaf-soft)}
.who .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who .ct{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.who .mini{grid-column:1/-1;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.who .mini i{display:block;height:100%;background:var(--leaf)}
.upd{font-size:13px;color:var(--muted);margin-top:12px}

.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.ro{margin-top:14px;font-size:14px;color:var(--muted);display:flex;gap:8px;align-items:center}
.ro::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--gold);flex:none}

.savebar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--band);color:var(--band-ink);
  padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-top:12px;box-shadow:0 -6px 20px #0003}
.savebar .wrap{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.savebar .msg{flex:1 1 220px;min-width:0;font-weight:600}
.savebar .btn{border-color:#ffffff40;background:transparent;color:inherit}
.savebar .btn.pri{background:#F6D27A;border-color:#F6D27A;color:#5A0D17}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;max-width:calc(100% - 32px);font-weight:600}

@media (max-width:900px){
  .layout{grid-template-columns:minmax(0,1fr)}
  aside{position:static;order:-1}
  .who ol{max-height:none;display:flex;flex-wrap:wrap;gap:4px}
  .who li button{width:auto;display:flex;gap:6px}
  .who .mini{display:none}
  .summary{grid-template-columns:1fr 1fr 1fr}
  .summary .stat:first-child{grid-column:1/-1}
}
@media (max-width:520px){
  .plate img{width:160px}
  .countdown{min-width:0;padding:8px 12px}.countdown b{font-size:34px}
  form.ed{grid-template-columns:1fr}
  .seg button{padding:6px 11px;font-size:14px}
}
@media (prefers-reduced-motion:no-preference){.bar i,.who .mini i{transition:width .4s ease}.tree-fill{transition:y .6s ease,height .6s ease}.orn{transition:opacity .4s ease}}
</style>
</head><body>

<script id="app-js">
(function(){
var $=function(s){return document.querySelector(s)};
var state={sections:[],dayNote:'',updated:''},loaded=false,busy=0;
var LOGO=$('#logo-data').textContent.trim();
var EVENT=new Date(2026,11,19);
var PHASES=[
  {id:'antes',name:'Antes do evento',date:'até 18 de dezembro'},
  {id:'sexta',name:'Véspera',date:'sexta-feira, 18 de dezembro'},
  {id:'sabado',name:'Dia da festa',date:'sábado, 19 de dezembro'},
  {id:'depois',name:'Depois do evento',date:'a partir de 6 de janeiro'}
];
var ui={phase:'all',person:'',q:'',pending:false,editing:null,adding:null,armed:false};
var dirty=0, readOnly=false, toastMsg='', toastTimer=null, saving=false;
try{var s=JSON.parse(sessionStorage.getItem('natal-ui')||'null');if(s){ui.phase=s.phase||'all';ui.person=s.person||'';ui.pending=!!s.pending;}
  var flash=sessionStorage.getItem('natal-flash');if(flash){toastMsg=flash;sessionStorage.removeItem('natal-flash');}}catch(e){}

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function people(t){return String(t.who||'').split('/').map(function(x){return x.trim()}).filter(Boolean)}
function today(){var d=new Date();d.setHours(0,0,0,0);return d}
function isLate(t){if(t.done||!t.date)return false;var d=new Date(t.date+'T23:59:59');return d<new Date()}
function allTasks(){var out=[];state.sections.forEach(function(s){s.tasks.forEach(function(t){out.push({t:t,s:s})})});return out}
function match(t,s){
  if(ui.phase!=='all'&&s.phase!==ui.phase)return false;
  if(ui.pending&&t.done)return false;
  if(ui.person&&people(t).indexOf(ui.person)<0)return false;
  if(ui.q){var q=ui.q.toLowerCase();if((t.text+' '+t.who+' '+(t.note||'')+' '+s.title).toLowerCase().indexOf(q)<0)return false}
  return true}
function uid(){return 't'+Math.random().toString(36).slice(2,9)}
function fmtUpd(iso){if(!iso)return '';var d=new Date(iso);if(isNaN(d))return '';
  return d.toLocaleDateString('pt-PT',{day:'numeric',month:'short'})+', '+d.toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit'})}

function ring(p){
  var top=8,bot=120,h=bot-top,y=bot-h*p/100;
  var tiers='<polygon points="60,8 30,46 90,46"/><polygon points="60,26 20,78 100,78"/><polygon points="60,52 8,120 112,120"/>';
  var orn=[[60,38,'#C41E35'],[45,66,'#D4A12C'],[76,62,'#C41E35'],[60,72,'#2f7fd1'],[34,100,'#D4A12C'],[56,104,'#C41E35'],[84,98,'#D4A12C'],[70,110,'#2f7fd1'],[44,40,'#D4A12C'],[24,112,'#C41E35']];
  var o=orn.map(function(b,i){var on=p>=(i+1)*10;return '<circle class="orn" cx="'+b[0]+'" cy="'+b[1]+'" r="4.6" fill="'+b[2]+'" opacity="'+(on?1:0)+'"/>'}).join('');
  var star=p>=100?'#F6C445':'var(--line)';
  return '<svg viewBox="0 0 120 140" aria-hidden="true"><defs><clipPath id="treeclip"><rect class="tree-fill" x="0" y="'+y.toFixed(1)+'" width="120" height="'+(bot-y+20).toFixed(1)+'"/></clipPath></defs>'+
    '<rect x="52" y="120" width="16" height="14" rx="2" fill="#8a5a33"/>'+
    '<g fill="var(--line)">'+tiers+'</g><g fill="#2E7D3A" clip-path="url(#treeclip)">'+tiers+'</g>'+o+
    '<polygon points="60,0 63,7 70,7 64.5,11.5 66.5,18.5 60,14 53.5,18.5 55.5,11.5 50,7 57,7" fill="'+star+'"'+(p>=100?' style="filter:drop-shadow(0 0 4px #F6C445)"':'')+'/></svg>'}
function dueBadge(t){
  if(t.tbd)return '<span class="due tbd">Data por definir</span>';
  if(!t.due)return '';
  if(isLate(t))return '<span class="due late">Atrasada · '+esc(t.due)+'</span>';
  return '<span class="due">'+esc(t.due)+'</span>'}

function form(t,secId){
  var del=t?'<button type="button" class="btn danger'+(ui.armed?' armed':'')+'" data-act="del">'+(ui.armed?'Confirmar remoção':'Remover tarefa')+'</button>':'';
  return '<form class="ed" data-sec="'+esc(secId)+'">'+
   '<label class="full">Tarefa<input class="field" id="f-text" required value="'+esc(t?t.text:'')+'"></label>'+
   '<label class="full">Responsáveis (separe com /)<input class="field" id="f-who" value="'+esc(t?t.who:'')+'" placeholder="Ex.: Márcia Simões / Vânia Mónico"></label>'+
   '<label>Prazo ou hora (texto)<input class="field" id="f-due" value="'+esc(t?t.due||'':'')+'" placeholder="Ex.: até 13/11 ou 12h00"></label>'+
   '<label>Data limite (para avisar atrasos)<input class="field" type="date" id="f-date" value="'+esc(t?t.date||'':'')+'"></label>'+
   '<label class="full">Nota<input class="field" id="f-note" value="'+esc(t?t.note||'':'')+'" placeholder="Opcional"></label>'+
   '<div class="row">'+del+'<span class="spacer"></span><button type="button" class="btn" data-act="cancel">Cancelar</button><button type="submit" class="btn pri">'+(t?'Aplicar':'Adicionar')+'</button></div>'+
   '</form>'}

function render(){
  var all=allTasks(), done=all.filter(function(x){return x.t.done}).length;
  var late=all.filter(function(x){return isLate(x.t)}).length;
  var tbd=all.filter(function(x){return x.t.tbd&&!x.t.done}).length;
  var days=Math.round((EVENT-today())/864e5);
  var pct=all.length?Math.round(done/all.length*100):0;
  var dayLabel=days>1?'dias':(days===1?'dia':'');
  var cd=days>0?'<b>'+days+'</b><span>'+dayLabel+' para a festa</span>':(days===0?'<b>Hoje</b><span>é a festa</span>':'<b>✓</b><span>festa realizada</span>');

  var lights='';for(var li=0;li<70;li++){lights+='<i style="left:'+(li*34+12)+'px;color:'+['#ff5a6a','#7BE05A','#FFD45C','#6FB8FF'][li%4]+';animation-delay:'+((li*37)%16/10)+'s"></i>'}
  var h='<header class="band"><canvas id="snow"></canvas><div class="lights" aria-hidden="true">'+lights+'</div><div class="wrap">'+
    '<div class="plate"><img src="'+LOGO+'" alt="Aquino Construções"></div>'+
    '<div class="head"><div class="eyebrow">Feliz Natal</div><h1>Organização da <em>Festa de Natal</em> 2026</h1>'+
    '<div class="when"><span>Sábado, 19 de dezembro de 2026</span><span>Amigo Secreto a partir das 14h30</span></div></div>'+
    '<div class="countdown">'+cd+'</div></div></header>';

  h+='<div class="wrap"><section class="summary" aria-label="Resumo">'+
    '<div class="stat prog"><div class="ring" role="img" aria-label="Árvore de progresso: '+pct+'% das tarefas feitas">'+ring(pct)+'<div class="ring-c"><b>'+pct+'%</b><span>'+done+' de '+all.length+' tarefas</span></div></div>'+
      '<div class="pbars"><div class="k">Progresso por fase</div>'+PHASES.map(function(p){
        var pt=all.filter(function(x){return x.s.phase===p.id}),pd=pt.filter(function(x){return x.t.done}).length,pp=pt.length?Math.round(pd/pt.length*100):0;
        return '<div class="pb"><span class="pl">'+p.name+'</span><span class="pv">'+pd+'/'+pt.length+'</span><div class="bar"><i style="width:'+pp+'%"></i></div></div>'}).join('')+
      '</div></div>'+
    '<div class="stat"><div class="k">Por fazer</div><div class="v">'+(all.length-done)+'</div></div>'+
    '<div class="stat warn"><div class="k">Atrasadas</div><div class="v">'+late+'</div></div>'+
    '<div class="stat tbd"><div class="k">Sem data</div><div class="v">'+tbd+'</div></div>'+
  '</section>';

  var counts={all:all.length};PHASES.forEach(function(p){counts[p.id]=all.filter(function(x){return x.s.phase===p.id}).length});
  var names={};all.forEach(function(x){people(x.t).forEach(function(n){names[n]=names[n]||{n:0,d:0};names[n].n++;if(x.t.done)names[n].d++})});
  var nameList=Object.keys(names).sort(function(a,b){return a.localeCompare(b,'pt')});

  h+='<div class="tools"><div class="seg" role="group" aria-label="Fase">'+
    '<button data-phase="all" aria-pressed="'+(ui.phase==='all')+'">Tudo<span class="n">'+counts.all+'</span></button>'+
    PHASES.map(function(p){return '<button data-phase="'+p.id+'" aria-pressed="'+(ui.phase===p.id)+'">'+p.name+'<span class="n">'+counts[p.id]+'</span></button>'}).join('')+
    '</div>'+
    '<select class="field grow" id="person" aria-label="Responsável" style="max-width:240px"><option value="">Todos os responsáveis</option>'+
      nameList.map(function(n){return '<option'+(ui.person===n?' selected':'')+'>'+esc(n)+'</option>'}).join('')+'</select>'+
    '<input class="field grow" id="q" type="search" placeholder="Procurar tarefa…" value="'+esc(ui.q)+'">'+
    '<label class="check"><input type="checkbox" id="pending"'+(ui.pending?' checked':'')+'>Só por fazer</label></div>';

  h+='<div class="layout"><main>';
  var any=false;
  PHASES.forEach(function(p){
    var secs=state.sections.filter(function(s){return s.phase===p.id});
    var body='';
    secs.forEach(function(s){
      var vis=s.tasks.filter(function(t){return match(t,s)});
      if(!vis.length&&!(ui.adding===s.id))return;
      var sd=s.tasks.filter(function(t){return t.done}).length;
      body+='<section class="sec'+(sd===s.tasks.length&&s.tasks.length?' done':'')+'"><div class="sec-h">'+
        (s.num?'<span class="num">'+s.num+'</span>':'<span class="num">·</span>')+
        '<h3>'+esc(s.title)+'</h3><span class="cnt">'+sd+'/'+s.tasks.length+'</span></div><ul class="tasks">'+
        vis.map(function(t){
          var chips=people(t).map(function(n){return '<button class="chip" data-person="'+esc(n)+'" title="Ver tarefas de '+esc(n)+'">'+esc(n)+'</button>'}).join('');
          var li='<li class="task'+(t.done?' is-done':'')+'"><input type="checkbox" data-done="'+t.id+'" aria-label="Marcar como feita: '+esc(t.text)+'"'+(t.done?' checked':'')+(readOnly?' disabled':'')+'>'+
            '<div><div class="t-text">'+esc(t.text)+'</div><div class="meta">'+chips+dueBadge(t)+'</div>'+(t.note?'<div class="note">'+esc(t.note)+'</div>':'')+'</div>'+
            (readOnly?'<span></span>':'<button class="edit-btn" data-edit="'+t.id+'">Editar</button>')+'</li>';
          if(ui.editing===t.id)li+='<li>'+form(t,s.id)+'</li>';
          return li}).join('')+'</ul>'+
        (ui.adding===s.id?form(null,s.id):(readOnly?'':'<button class="add" data-add="'+s.id+'">+ Adicionar tarefa</button>'))+'</section>';
      any=true});
    if(body){h+='<div class="phase"><div class="phase-h"><h2>'+p.name+'</h2><span class="date">'+p.date+'</span></div>'+
      (p.id==='sabado'&&state.dayNote?'<p class="pnote"><b>Nota:</b> '+esc(state.dayNote)+'</p>':'')+body+'</div>'}
  });
  if(!loaded)h+='<div class="empty">A carregar as tarefas…</div>';else if(!any)h+='<div class="empty">Nenhuma tarefa corresponde aos filtros. <button class="btn" data-act="clear">Limpar filtros</button></div>';
  h+='</main><aside><div class="who"><h2>Quem faz o quê</h2><p>Toque num nome para ver só as tarefas dessa pessoa.</p><ol>'+
    nameList.map(function(n){var x=names[n];return '<li><button data-person="'+esc(n)+'" aria-pressed="'+(ui.person===n)+'"><span class="nm">'+esc(n)+'</span><span class="ct">'+x.d+'/'+x.n+'</span><span class="mini"><i style="width:'+Math.round(x.d/x.n*100)+'%"></i></span></button></li>'}).join('')+
    '</ol>'+(state.updated?'<div class="upd">Última atualização: '+esc(fmtUpd(state.updated))+'</div>':'')+
    (readOnly?'<div class="ro">Modo de leitura</div>':'')+'</div></aside></div></div>';

  if(busy)h+='<div class="savebar"><div class="wrap"><span class="msg">A guardar…</span></div></div>';
  if(false)h+='<div class="savebar"><div class="wrap"><span class="msg">'+dirty+(dirty===1?' alteração por guardar':' alterações por guardar')+'</span>'+
    '<button class="btn" data-act="discard">Descartar</button><button class="btn pri" data-act="save"'+(saving?' disabled':'')+'>'+(saving?'A guardar…':'Guardar para todos')+'</button></div></div>';
  if(toastMsg)h+='<div class="toast" role="status">'+esc(toastMsg)+'</div>';

  var root=$('#root'), qFocus=document.activeElement&&document.activeElement.id==='q';
  root.innerHTML=h;
  if(qFocus){var qi=$('#q');qi.focus();qi.setSelectionRange(qi.value.length,qi.value.length)}
  try{sessionStorage.setItem('natal-ui',JSON.stringify({phase:ui.phase,person:ui.person,pending:ui.pending}))}catch(e){}
}

function toast(m){toastMsg=m;render();clearTimeout(toastTimer);toastTimer=setTimeout(function(){toastMsg='';render()},4000)}
function findTask(id){for(var i=0;i<state.sections.length;i++){var s=state.sections[i];for(var j=0;j<s.tasks.length;j++)if(s.tasks[j].id===id)return {s:s,t:s.tasks[j],j:j}}return null}

document.addEventListener('click',function(e){
  var b=e.target.closest('button,[data-done]');if(!b)return;
  if(b.dataset.phase){ui.phase=b.dataset.phase;render();return}
  if(b.dataset.person!==undefined){ui.person=ui.person===b.dataset.person?'':b.dataset.person;render();return}
  if(b.dataset.edit){ui.editing=ui.editing===b.dataset.edit?null:b.dataset.edit;ui.adding=null;ui.armed=false;render();var f=$('#f-text');if(f)f.focus();return}
  if(b.dataset.add){ui.adding=b.dataset.add;ui.editing=null;ui.armed=false;render();var f2=$('#f-text');if(f2)f2.focus();return}
  var act=b.dataset.act;
  if(act==='cancel'){ui.editing=null;ui.adding=null;ui.armed=false;render();return}
  if(act==='clear'){ui.phase='all';ui.person='';ui.q='';ui.pending=false;render();return}
  if(act==='del'){if(!ui.armed){ui.armed=true;render();return}
    var id=ui.editing,f=findTask(id);if(f){f.s.tasks.splice(f.j,1)}ui.editing=null;ui.armed=false;render();call('deleteTask',[id],'Tarefa removida.');return}
  });
document.addEventListener('change',function(e){
  var el=e.target;
  if(el.dataset&&el.dataset.done){if(readOnly){el.checked=!el.checked;return}var f=findTask(el.dataset.done);if(f){f.t.done=el.checked;render();call('setDone',[f.t.id,el.checked],el.checked?'Boa! Tarefa feita.':'')}return}
  if(el.id==='person'){ui.person=el.value;render()}
  if(el.id==='pending'){ui.pending=el.checked;render()}
});
document.addEventListener('input',function(e){if(e.target.id==='q'){ui.q=e.target.value;render()}});
document.addEventListener('submit',function(e){
  e.preventDefault();var fm=e.target;
  var text=$('#f-text').value.trim();if(!text)return;
  var data={text:text,who:$('#f-who').value.trim(),due:$('#f-due').value.trim(),date:$('#f-date').value,note:$('#f-note').value.trim()};
  var payload;
  if(ui.editing){var f=findTask(ui.editing);if(f){Object.assign(f.t,data);if(data.due||data.date)f.t.tbd=false;payload=Object.assign({id:f.t.id},data)}}
  else{var sec=state.sections.filter(function(s){return s.id===fm.dataset.sec})[0];if(sec){var local=Object.assign({id:uid(),done:false},data);sec.tasks.push(local);payload=Object.assign({sec:{phase:sec.phase,num:sec.num,title:sec.title}},data)}}
  ui.editing=null;ui.adding=null;ui.armed=false;render();
  if(payload)call('saveTask',[payload],'Guardado.');
});

var API='https://script.google.com/macros/s/AKfycbxoWN5rxYyZWt9V4CP1S0HP0h6felOzTjQPiuL16qUSFPk6Z0vF3iTFTmlQctCjVAc/exec';
function applyState(st){if(st&&st.sections){state=st;loaded=true}render()}
function post(fn,args){return fetch(API,{method:'POST',body:JSON.stringify({fn:fn,args:args||[]})}).then(function(r){return r.json()}).then(function(j){if(!j||j.error)throw new Error(j&&j.error);return j})}
function load(){post('getState',[]).then(applyState).catch(function(){if(!loaded)toast('Não foi possível carregar as tarefas. Atualize a página.')})}
function call(fn,args,okMsg){
  busy++;render();
  post(fn,args).then(function(st){busy--;applyState(st);if(okMsg)toast(okMsg)}).catch(function(){busy--;toast('Não foi possível guardar. Tente outra vez.');load()})}
render();
(function snow(){
  var flakes=[],still=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  for(var i=0;i<70;i++)flakes.push({x:Math.random(),y:Math.random(),r:1+Math.random()*2.6,v:.0006+Math.random()*.0016,d:Math.random()*6});
  function frame(t){
    var c=document.getElementById('snow');
    if(c){var w=c.clientWidth,h=c.clientHeight,dpr=window.devicePixelRatio||1;
      if(c.width!==Math.round(w*dpr)||c.height!==Math.round(h*dpr)){c.width=Math.round(w*dpr);c.height=Math.round(h*dpr)}
      var g=c.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,w,h);g.fillStyle='rgba(255,255,255,.85)';
      flakes.forEach(function(f){if(!still){f.y+=f.v;if(f.y>1.02){f.y=-.02;f.x=Math.random()}}
        var x=f.x*w+Math.sin(t/1400+f.d)*8;g.beginPath();g.arc(x,f.y*h,f.r,0,6.283);g.fill()})}
    if(!still)requestAnimationFrame(frame)}
  requestAnimationFrame(frame);
  if(still)window.addEventListener('resize',function(){requestAnimationFrame(frame)});
})();
if(toastMsg){toastTimer=setTimeout(function(){toastMsg='';render()},4000)}
load();
setInterval(function(){if(!busy&&!ui.editing&&!ui.adding&&document.visibilityState==='visible')load()},20000);
})();
</script>

</body></html>
